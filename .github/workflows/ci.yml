name: CI

on:
  push: {branches: [main]}
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 20 is the floor this package declares; 22 is what most people are on. Both, because a
        # client installed into other people's servers does not get to be surprised by either.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '${{ matrix.node }}', cache: npm}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
